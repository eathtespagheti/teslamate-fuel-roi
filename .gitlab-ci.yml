# GitLab CI (primary): lint the scripts, run the full test suite against a
# throwaway PostgreSQL service, and publish the container image.
stages:
  - test
  - build

shellcheck-and-smoke-test:
  stage: test
  # postgres:18-alpine provides psql for the importer test.
  image: postgres:18-alpine
  services:
    - name: postgres:18-alpine
      alias: postgres
      variables:
        # Throwaway CI database: trust auth, so no password is stored or sent.
        POSTGRES_HOST_AUTH_METHOD: trust
  variables:
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: postgres
    PGDATABASE: postgres
  before_script:
    # curl and jq are required by scripts/fetch.sh; shellcheck lints the scripts.
    - apk add --no-cache shellcheck bash curl jq
  script:
    - shellcheck scripts/*.sh
    - sh test/run.sh

# Publish the image to the GitLab Container Registry with rootless BuildKit
# (no privileged job pods). Runs on release tags only; the cluster's Flux image
# automation watches `vX.Y.Z` tags.
build-image:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=docker \
        --output type=image,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG,push=true
